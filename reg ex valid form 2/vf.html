<!DOCTYPE html> <!-- declares this is an HTML5 document -->
<html> <!-- starts the HTML document -->
<head> <!-- begins the document head section -->
  <meta charset="UTF-8"> <!-- ensures characters display correctly -->
  <title>Live Form Validation</title> <!-- sets the title in the browser tab -->
</head> <!-- closes the head -->
<body> <!-- begins the visible page content -->
  <h2>Form Validation Practice</h2> <!-- a heading for your form -->

  <!-- Name Field -->
  <label>Full Name:</label>
  <input id="nameInput" type="text" placeholder="e.g. Jane Doe">
  <span id="nameMsg"></span>

  <!-- Email Field -->
  <label>Email:</label>
  <input id="emailInput" type="text" placeholder="you@example.com">
  <span id="emailMsg"></span>

  <!-- Phone Field -->
  <label>Phone Number:</label>
  <input id="phoneInput" type="text" placeholder="1234567890">
  <span id="phoneMsg"></span>

  <!-- ZIP Field -->
  <label>ZIP Code:</label>
  <input id="zipInput" type="text" placeholder="e.g. 90210">
  <span id="zipMsg"></span>

  <script src="n.js"></script> <!-- links your JavaScript file -->
</body> <!-- closes the body section -->
</html> <!-- closes the document -->
