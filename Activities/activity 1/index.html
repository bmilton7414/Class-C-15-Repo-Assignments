<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity 1</title>
  <link rel="stylesheet" href="css/bootstrap.min.css" />

    </head>
<body>

 <!-- Start of the main container -->
<div class="container">

  <!-- Start of the row -->
  <div class="row">

    <!-- First Column: Takes up 6/12 columns on medium+ screens -->
    <div class="col-md-6">

      <!-- Bootstrap card component -->
      <div class="card">

        <!-- Inside content area of the card -->
        <div class="card-body">
          <h5 class="card-title">Column 1</h5>
          <p class="card-text">This is the first column using Bootstrap's grid and card component.</p>
        </div>

      </div>
    </div>

    <!-- Second Column -->
    <div class="col-md-6">

      <!-- Another Bootstrap card -->
      <div class="card">

        <!-- Inside content area -->
        <div class="card-body">
          <h5 class="card-title">Column 2</h5>
          <p class="card-text">This is the second column, stacked at small screen sizes.</p>
        </div>

      </div>
    </div>

  </div> <!-- End of row -->

</div> <!-- End of container -->


    <sscript src="js/bootstrap.min.js"></script>
</body>
</html>
