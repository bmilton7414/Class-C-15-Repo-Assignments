<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Card</title>
  
  <!-- Link to external CSS stylesheet for styling the movie card -->
  <link rel="stylesheet" href="css/movie.css">
</head>
<body>

  <!-- Container where the selected movie details will be displayed -->
  <div id="movie-container" class="card"></div>

  <!-- Button to toggle between movies in the list -->
  <button id="toggle-button">Switch Movie</button>

  <!-- Form to add a new movie to the movie list -->
  <form id="movie-form">
    <h3>Add a New Movie</h3>
    
    <!-- User input fields for new movie details -->
    <input type="text" id="new-title" placeholder="Title" required>
    <input type="number" id="new-year" placeholder="Year" required>
    <input type="text" id="new-genre" placeholder="Genre" required>
    <input type="text" id="new-director" placeholder="Director Name" required>
    
    <!-- Submit button to add the new movie -->
    <button type="submit">Add Movie</button>
  </form>

  <!-- Link to external JavaScript file that handles functionality -->
  <script src="js/movie.js"></script>
</body>
</html>
