<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Responsive Book List</title>
    <style>
      :root {
        --gap: 1rem;
        --card-min-width: 200px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: var(--gap);
        font-family: Arial, sans-serif;
        background: #fafafa;
      }
      h1 {
        text-align: center;
        margin-bottom: var(--gap);
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gap);
        justify-content: center;
        margin-bottom: var(--gap);
      }
      form input,
      form button {
        padding: 0.5rem;
        font-size: 1rem;
      }
      form input {
        flex: 1 1 150px;
        min-width: 120px;
      }
      form button {
        flex: 0 0 auto;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #book-list {
        display: grid;
        gap: var(--gap);
        grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr));
      }
      .card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: var(--gap);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
      }
      .card h3 {
        margin: 0 0 0.5rem;
        font-size: 1.2rem;
      }
      .card p {
        margin: 0.3rem 0;
        flex: 1 1 auto;
      }
      .card button {
        align-self: flex-end;
        padding: 0.4rem 0.8rem;
        font-size: 0.9rem;
        background: #dc3545;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      @media (max-width: 400px) {
        form input,
        form button {
          flex: 1 1 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>My Book List</h1>

    <form id="book-form">
      <input id="title"   type="text"   placeholder="Title"   required>
      <input id="author"  type="text"   placeholder="Author"  required>
      <input id="pages"   type="number" placeholder="Pages"   required>
      <button type="submit">Add Book</button>
    </form>

    <div id="book-list"></div>

    <script>
      // 1. Book constructor — each book has 3 properties
      function Book(title, author, pages) {
        this.title  = title;
        this.author = author;
        this.pages  = pages;
      }

      // 2. Library constructor — holds all books
      function Library() {
        this.books = [];
      }

      // Method: add a book
      Library.prototype.addBook = function(book) {
        this.books.push(book);
      };

      // Method: remove a book by array index
      Library.prototype.removeBook = function(index) {
        this.books.splice(index, 1);
      };

      // 3. Instantiate one Library
      const myLibrary = new Library();

      // 4. Get references to the form and book-list container
      const form   = document.getElementById('book-form');
      const listEl = document.getElementById('book-list');

      // 5. On form submit...
      form.addEventListener('submit', function(e) {
        e.preventDefault();

        const title  = document.getElementById('title').value.trim();
        const author = document.getElementById('author').value.trim();
        const pages  = document.getElementById('pages').value.trim();

        const book = new Book(title, author, pages);
        myLibrary.addBook(book);

        form.reset();
        render();
      });

      // 6. render() — redraws all book cards
      function render() {
        listEl.innerHTML = '';

        myLibrary.books.forEach(function(book, idx) {
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML =
            '<h3>' + book.title + '</h3>' +
            '<p><strong>Author:</strong> ' + book.author + '</p>' +
            '<p><strong>Pages:</strong> '  + book.pages  + '</p>' +
            '<button data-index="' + idx + '">Remove</button>';

          listEl.appendChild(card);
        });
      }

      // 7. Remove book on button click (event delegation)
      listEl.addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') {
          const index = e.target.dataset.index;
          myLibrary.removeBook(index);
          render();
        }
      });

      // 8. Initial call to show an empty list
      render();
    </script>
  </body>
</html>
