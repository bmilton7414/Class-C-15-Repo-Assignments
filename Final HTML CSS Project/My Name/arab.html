<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blakk Arab</title>
  <style>

#namedisplay {
    font-size: 50px;
    color: #0a28d4;
    text-align: center;
    margin-top: 20%;
    font-family: 'cursive';
    text-shadow: 2px 2px 4px #000000;
    animation-iteration-count: calc(1000 * 1000);
    animation-name: blakk;                                  
    animation-duration: 5s;
    animation-timing-function: ease-in-out;
    animation-delay: 3s;
    animation-direction: alternate;
    animation-fill-mode: forwards;
    animation-play-state: running;
    animation: blakk 5s ease-in-out infinite alternate;
}

  </style>
</head>
<body>
    <h1 id="namedisplay">Blakk Arab </h1>


<script src="index.js"></script>

    
</body>
</html>
