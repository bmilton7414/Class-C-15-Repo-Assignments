<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Two Column Layout Example</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1 id="page-title">Brads Web Layout</h1>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h2>Sidebar</h2>
      <p>This is the sidebar content. It is styled with background color, border, and padding.</p>
    </aside>

    <main class="main-content">
      <h2>Main Content</h2>
      <p>This is the main area. The layout uses relative and absolute positioning in demonstration below.</p>
      <div class="relative-box">
        Relative box
        <div class="absolute-box">Absolute inside</div>
      </div>
    </main>
  </div>

  <footer>
    <p>Footer section</p>
  </footer>

</body>
</html>
